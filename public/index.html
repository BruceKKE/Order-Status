<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>外贸订单管家</title>
  <style>
    :root{color-scheme:light;--bg:#f5f7fb;--panel:#fff;--line:#e2e8f0;--text:#172033;--muted:#64748b;--brand:#2451a4;--good:#059669;--warn:#d97706;--bad:#dc2626;--shadow:0 12px 32px rgba(15,23,42,.07)}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}.auth-screen{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#eef4ff,#f8fafc 48%)}.auth-card{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:var(--shadow)}.logo{background-image:url('/wincotek-logo.png');background-repeat:no-repeat;background-position:center}.auth-logo{width:100%;height:82px;margin:-2px 0 8px;background-size:84% auto}.auth-card h1{margin:4px 0 6px;font-size:23px}.auth-card p{margin:0 0 22px;color:var(--muted);font-size:14px;line-height:1.6}.auth-card label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.auth-card input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px}.auth-card button{width:100%;margin-top:14px;border:0;border-radius:10px;padding:11px;background:var(--brand);color:#fff;font-weight:800;cursor:pointer}.auth-card button:disabled{opacity:.6}.auth-error{min-height:20px;color:var(--bad);font-size:13px;margin-top:10px}.toolbar-actions{display:flex;gap:8px}.logout{border:1px solid var(--line);background:#fff;color:var(--muted);padding:9px 13px;border-radius:10px;cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:#fff;border-right:1px solid var(--line);padding:24px 18px;position:sticky;top:0;height:100vh}.brand{margin:0 8px 26px}.sidebar-logo{width:100%;height:54px;background-size:84% auto}.brand small{display:block;color:var(--muted);text-align:center;margin-top:2px}nav{display:grid;gap:7px}.nav-btn{border:0;background:transparent;text-align:left;border-radius:11px;padding:11px 13px;color:#475569;cursor:pointer}.nav-btn:hover,.nav-btn.active{background:#eef4ff;color:var(--brand);font-weight:700}.side-note{position:absolute;bottom:20px;left:18px;right:18px;padding:13px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:12px;line-height:1.5}.main{padding:28px;min-width:0}.toolbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px}.toolbar h2{margin:0 0 5px;font-size:25px}.meta{color:var(--muted);font-size:13px}.refresh{border:1px solid #bfdbfe;background:#fff;color:var(--brand);padding:9px 13px;border-radius:10px;cursor:pointer;font-weight:700}.refresh:disabled{opacity:.55}.notice{display:none;padding:13px 15px;border-radius:11px;margin-bottom:18px}.notice.show{display:block}.notice.error{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}.notice.stale{background:#fffbeb;color:#92400e;border:1px solid #fde68a}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.card{padding:18px}.card-label{color:var(--muted);font-size:13px}.card-value{font-size:25px;font-weight:800;margin-top:8px}.card-sub{font-size:12px;color:var(--muted);margin-top:4px}.panel{overflow:hidden;margin-bottom:18px}.filter-panel{overflow:visible}.panel-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px}.panel-head h3{margin:0;font-size:16px}.receivable-title{display:flex;align-items:center;gap:20px;flex-wrap:wrap}.receivable-metric{font-size:12px;color:var(--muted)}.receivable-metric strong{display:block;margin-top:3px;font-size:16px;color:var(--text)}.search{border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:230px}.multi-filter{position:relative;width:260px}.multi-filter summary{list-style:none;border:1px solid var(--line);border-radius:9px;padding:9px 36px 9px 11px;background:#fff;color:#475569;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}.multi-filter summary::-webkit-details-marker{display:none}.multi-filter summary::after{content:"⌄";position:absolute;right:12px;top:7px;color:var(--muted);font-size:18px}.multi-filter[open] summary{border-color:#93c5fd;box-shadow:0 0 0 3px #dbeafe}.multi-filter[open] summary::after{transform:rotate(180deg);top:10px}.multi-filter-menu{position:absolute;z-index:20;right:0;top:calc(100% + 8px);width:300px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 36px rgba(15,23,42,.16)}.multi-filter-search{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:9px}.multi-filter-options{max-height:240px;overflow:auto;margin:0 -4px;padding:0 4px}.multi-filter-option{display:flex;align-items:center;gap:9px;padding:8px;border-radius:8px;cursor:pointer;font-size:13px}.multi-filter-option:hover{background:#f8fafc}.multi-filter-option input{width:16px;height:16px;accent-color:var(--brand)}.multi-filter-footer{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid #edf2f7;margin-top:8px;padding-top:10px}.multi-filter-hint{color:var(--muted);font-size:12px}.filter-clear{border:0;background:transparent;color:var(--brand);font-size:12px;font-weight:700;cursor:pointer;padding:4px}.month-picker{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;color:var(--text)}.collection-customer{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%}.collection-contact{color:var(--muted);font-size:12px;margin-top:5px}.collection-action{border:1px solid #bfdbfe;background:#fff;color:var(--brand);padding:9px 13px;border-radius:9px;cursor:pointer;font-weight:700;white-space:nowrap}.collection-action:hover{background:#eff6ff}.collection-action.warn{border-color:#fed7aa;color:#c2410c;background:#fff7ed}.collection-total{font-weight:800;font-size:17px;margin-top:3px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:820px}th,td{text-align:left;padding:12px 15px;border-bottom:1px solid #edf2f7;font-size:13px;vertical-align:top}th{color:var(--muted);font-weight:600;background:#fafbfc;position:sticky;top:0}tr:last-child td{border-bottom:0}.money{font-variant-numeric:tabular-nums;font-weight:650}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}.tag{display:inline-flex;border-radius:999px;padding:4px 8px;background:#f1f5f9;color:#475569;font-size:11px;font-weight:700}.tag.good{background:#ecfdf5;color:#047857}.tag.warn{background:#fff7ed;color:#c2410c}.tag.bad{background:#fef2f2;color:#b91c1c}.empty{padding:44px;text-align:center;color:var(--muted)}.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted)}.detail{color:var(--muted);font-size:12px;margin-top:4px}.hidden{display:none!important}
    .collection-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.collection-action:disabled{cursor:not-allowed;opacity:.55;background:#f8fafc;color:var(--muted);border-color:var(--line)}
    @media(max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.app{display:block}.sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:14px}.brand{margin-bottom:12px}nav{display:flex;overflow:auto}.nav-btn{white-space:nowrap}.side-note{display:none}.main{padding:18px}.toolbar{align-items:center}.cards{grid-template-columns:1fr 1fr}.search{width:150px}.panel-head{align-items:stretch;flex-direction:column}.multi-filter{width:100%}.multi-filter-menu{left:0;right:auto;width:min(300px,calc(100vw - 72px))}.collection-customer{align-items:stretch;flex-direction:column}.collection-actions{justify-content:stretch}.collection-action{width:100%}}@media(max-width:480px){.cards{grid-template-columns:1fr}.toolbar h2{font-size:21px}}
  </style>
</head>
<body>
  <div id="auth" class="auth-screen">
    <form id="login-form" class="auth-card">
      <div class="logo auth-logo" role="img" aria-label="WincoTek"></div>
      <h1>外贸订单管家</h1>
      <p>请输入访问密码。业务数据不会保存在浏览器中。</p>
      <label for="password">访问密码</label>
      <input id="password" name="password" type="password" minlength="12" autocomplete="current-password" required autofocus>
      <button id="login-button" type="submit">登录</button>
      <div id="auth-error" class="auth-error" role="alert"></div>
    </form>
  </div>
  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand"><div class="logo sidebar-logo" role="img" aria-label="WincoTek"></div><small>外贸订单管家 · Feishu Live</small></div>
      <nav>
        <button class="nav-btn active" data-view="dashboard">业务概览</button>
        <button class="nav-btn" data-view="receivables">客户应收汇总</button>
        <button class="nav-btn" data-view="collections">月度回款计划</button>
        <button class="nav-btn" data-view="orders">客户订单</button>
        <button class="nav-btn" data-view="suppliers">供应商订单</button>
        <button class="nav-btn" data-view="shipments">CI 发货与应收</button>
      </nav>
      <div class="side-note">只读页面<br>数据来自飞书多维表格<br>订单、发货、收款按不同业务粒度展示</div>
    </aside>
    <main class="main">
      <div id="loading" class="loading">正在读取飞书数据…</div>
      <div id="content" class="hidden">
        <header class="toolbar"><div><h2 id="title">业务概览</h2><div id="meta" class="meta"></div></div><div class="toolbar-actions"><button id="refresh" class="refresh">刷新数据</button><button id="logout" class="logout">退出</button></div></header>
        <div id="notice" class="notice" role="status" aria-live="polite"></div>
        <section id="dashboard-view"></section>
        <section id="receivables-view" class="hidden"></section>
        <section id="collections-view" class="hidden"></section>
        <section id="orders-view" class="hidden"></section>
        <section id="suppliers-view" class="hidden"></section>
        <section id="shipments-view" class="hidden"></section>
      </div>
    </main>
  </div>
  <script>
    const state={data:null,view:"dashboard",busy:false,timer:null,started:false,openFilter:null,collectionMonth:"",monthlyPlan:[],filters:{receivables:{query:"",selected:new Set()},orders:{query:"",selected:new Set()},suppliers:{query:"",selected:new Set()},shipments:{query:"",selected:new Set()}}};
    const $=selector=>document.querySelector(selector);
    const money=(value,currency="USD")=>new Intl.NumberFormat("zh-CN",{style:"currency",currency:currency||"USD",maximumFractionDigits:2}).format(Number(value||0));
    const pct=value=>`${(Number(value||0)*(Math.abs(value)<=1?100:1)).toFixed(1)}%`;
    const safe=value=>String(value??"").replace(/[&<>'"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[ch]));
    const tag=value=>{const text=String(value||"未设置");const cls=/逾期|异常|风险|未匹配|取消/.test(text)?"bad":/完成|已收|已付|已发完|正常|闭环/.test(text)?"good":/部分|待|未/.test(text)?"warn":"";return `<span class="tag ${cls}">${safe(text)}</span>`};
    const empty=message=>`<div class="empty">${safe(message)}</div>`;
    const linkedOrders=row=>Array.isArray(row?.orderNos)?row.orderNos:[];
    const normalizedName=value=>String(value||"").trim();
    const uniqueNames=(rows,key)=>[...new Set(rows.map(row=>normalizedName(row[key])).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"zh-CN"));
    function availableNames(rows,key,kind){const names=uniqueNames(rows,key),valid=new Set(names);for(const selected of state.filters[kind].selected)if(!valid.has(selected))state.filters[kind].selected.delete(selected);return names}
    function filterLabel(kind,label){const filter=state.filters[kind],selected=[...filter.selected],searching=filter.query.trim();if(selected.length===1)return `${selected[0]}${searching?" · 搜索中":""}`;if(selected.length>1)return `已选 ${selected.length} 个${label}${searching?" · 搜索中":""}`;if(searching)return `搜索：${searching}`;return `全部${label}`}
    function multiFilter(kind,label,names,searchPlaceholder){const filter=state.filters[kind],open=state.openFilter===kind?" open":"";return `<details class="multi-filter" data-filter-details="${kind}"${open}><summary>${safe(filterLabel(kind,label))}</summary><div class="multi-filter-menu"><input class="multi-filter-search" data-filter-query="${kind}" value="${safe(filter.query)}" placeholder="${safe(searchPlaceholder)}" aria-label="${safe(searchPlaceholder)}"><div class="multi-filter-options">${names.map(name=>`<label class="multi-filter-option"><input type="checkbox" data-filter-option="${kind}" value="${safe(name)}" ${filter.selected.has(name)?"checked":""}><span>${safe(name)}</span></label>`).join("")}</div><div class="multi-filter-footer"><span class="multi-filter-hint">可同时勾选多个${safe(label)}</span><button class="filter-clear" type="button" data-filter-clear="${kind}">清除筛选</button></div></div></details>`}
    function matchesFilter(row,kind,nameKey,searchFields){const filter=state.filters[kind];if(filter.selected.size&&!filter.selected.has(normalizedName(row[nameKey])))return false;const query=filter.query.trim().toLowerCase();return !query||JSON.stringify(searchFields(row)).toLowerCase().includes(query)}
    function monthKey(value=new Date()){const parts=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Singapore",year:"numeric",month:"2-digit"}).formatToParts(new Date(value)),year=parts.find(part=>part.type==="year")?.value,month=parts.find(part=>part.type==="month")?.value;return `${year}-${month}`}
    function dateKey(value=new Date()){const parts=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Singapore",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date(value)),get=type=>parts.find(part=>part.type===type)?.value;return `${get("year")}-${get("month")}-${get("day")}`}
    function monthName(key,locale="zh-CN"){const date=new Date(`${key}-01T00:00:00+08:00`);return Number.isNaN(date.getTime())?key:date.toLocaleDateString(locale,{timeZone:"Asia/Singapore",year:"numeric",month:"long"})}
    function extractEmails(value){return [...new Set(String(value||"").split(/[;,\s]+/).map(part=>part.trim()).filter(part=>part&&!/[%\u0000-\u001f\u007f]/.test(part)&&/^[A-Z0-9.!#$&'*+/=?^_`{|}~-]+@[A-Z0-9.-]+\.[A-Z]{2,}$/i.test(part)))]}
    const cleanMailHeader=value=>String(value||"").replace(/[\u0000-\u001f\u007f]+/g," ").trim();
    function currencyTotals(rows){const totals=new Map();for(const row of rows){const currency=row.currency||"USD";totals.set(currency,(totals.get(currency)||0)+Number(row.outstanding||0))}return [...totals.entries()].sort(([a],[b])=>a.localeCompare(b))}
    function totalsText(totals,locale="zh-CN"){return totals.length?totals.map(([currency,value])=>new Intl.NumberFormat(locale,{style:"currency",currency,maximumFractionDigits:2}).format(value)).join(" / "):"—"}
    function buildMonthlyPlan(month){const result=[];for(const group of state.data.receivablesByCustomer){const items=(group.schedules||[]).filter(schedule=>schedule.dueDate&&schedule.dueDate.slice(0,7)<=month&&Number(schedule.outstanding||0)>0).map(schedule=>({ciNo:schedule.ciNo,orderNos:linkedOrders(schedule),dueDate:schedule.dueDate,currency:schedule.currency||"USD",outstanding:Number(schedule.outstanding||0),status:schedule.status})).sort((a,b)=>a.dueDate.localeCompare(b.dueDate)||String(a.ciNo||"").localeCompare(String(b.ciNo||"")));if(items.length)result.push({customerName:group.customerName,customerEmail:group.customerEmail||"",contactName:group.contactName||"",emailEligible:group.emailEligible!==false,items,totals:currencyTotals(items)})}return result.sort((a,b)=>String(a.customerName||"").localeCompare(String(b.customerName||""),"zh-CN"))}
    function reminderDraft(group){const period=monthName(state.collectionMonth,"en-US"),recipient=extractEmails(group.customerEmail).join(","),today=dateKey(state.data.meta.generatedAt||new Date()),pastDue=group.items.filter(item=>item.dueDate&&item.dueDate<today).length,timing=pastDue===group.items.length?"past":pastDue?"mixed":"upcoming",subject=cleanMailHeader(`Payment Reminder - ${group.customerName} - Currently Outstanding, Due by ${period}`),details=group.items.map(item=>`- CI ${item.ciNo||"N/A"} | Order ${item.orderNos.join(" / ")||"N/A"} | Due ${item.dueDate} | ${totalsText([[item.currency,item.outstanding]],"en-US")}`),intro=`Our current records show the following unpaid payment(s) due on or before the end of ${period}:`,requestLine=timing==="past"?"Could you please confirm the expected payment date and arrange payment as soon as possible? Once payment is made, kindly share the remittance advice with us.":timing==="mixed"?"Please arrange the past-due item(s) as soon as possible and the upcoming item(s) by their due date(s). Once payment is made, kindly share the remittance advice with us.":"Could you please confirm the expected payment date and arrange payment by the due date(s) above? Once payment is made, kindly share the remittance advice with us.",body=[`Dear ${group.contactName||"Accounts Team"},`,"","I hope you are well.","",intro,"",...details,"",`Total outstanding: ${totalsText(group.totals,"en-US")}`,"",requestLine,"","If payment has already been made, please disregard this reminder and send us the payment details so we can update our records.","","Best regards,","WincoTek"].join("\n");return {recipient,subject,body}}
    function mailtoHref(draft){const recipient=extractEmails(draft.recipient).map(email=>encodeURIComponent(email)).join(",");return `mailto:${recipient}?subject=${encodeURIComponent(cleanMailHeader(draft.subject))}&body=${encodeURIComponent(draft.body)}`}
    const reminderClipboardText=draft=>[`To: ${draft.recipient}`,`Subject: ${draft.subject}`,"",draft.body].join("\n");
    async function copyText(value){if(navigator.clipboard?.writeText)return navigator.clipboard.writeText(value);const area=document.createElement("textarea");area.value=value;area.style.position="fixed";area.style.opacity="0";document.body.appendChild(area);area.select();const copied=document.execCommand("copy");area.remove();if(!copied)throw new Error("复制失败")}
    function showNotice(message,type="error"){const el=$("#notice");el.textContent=message;el.className=`notice show ${type}`}
    function clearNotice(){$("#notice").className="notice"}
    function customerSummary(orders){const map=new Map();for(const order of orders){const row=map.get(order.customerName)||{name:order.customerName,sales:0,profit:0,count:0};row.sales+=order.amount;row.profit+=order.profit;row.count++;map.set(order.customerName,row)}return [...map.values()].sort((a,b)=>b.sales-a.sales)}
    function renderDashboard(){const d=state.data,s=d.summary,customers=customerSummary(d.orders).slice(0,10),unpaidCis=d.cis.filter(ci=>ci.outstanding>0).sort((a,b)=>(a.dueDate||"9999").localeCompare(b.dueDate||"9999")).slice(0,12);$("#dashboard-view").innerHTML=`
      <div class="cards">
        <div class="card"><div class="card-label">累计订单销售额</div><div class="card-value">${money(s.totalSales)}</div><div class="card-sub">订单粒度 · ${s.orderCount} 个订单</div></div>
        <div class="card"><div class="card-label">累计订单毛利润</div><div class="card-value good">${money(s.totalProfit)}</div><div class="card-sub">订单粒度 · 当前核算汇率</div></div>
        <div class="card"><div class="card-label">加权毛利率</div><div class="card-value">${pct(s.weightedMargin)}</div><div class="card-sub">利润合计 ÷ 销售额合计</div></div>
        <div class="card"><div class="card-label">CI 未收应收</div><div class="card-value ${s.totalOutstanding>0?'warn':'good'}">${money(s.totalOutstanding)}</div><div class="card-sub">ARCI 核销粒度 · ${s.outstandingCiCount} 个待收 CI</div></div>
      </div>
      <div class="panel"><div class="panel-head"><h3>客户贡献（订单口径）</h3></div><div class="table-wrap"><table><thead><tr><th>客户</th><th>订单数</th><th>销售额</th><th>毛利润</th><th>加权毛利率</th></tr></thead><tbody>${customers.map(c=>`<tr><td><strong>${safe(c.name)}</strong></td><td>${c.count}</td><td class="money">${money(c.sales)}</td><td class="money good">${money(c.profit)}</td><td>${pct(c.sales?c.profit/c.sales:0)}</td></tr>`).join("")}</tbody></table></div></div>
      <div class="panel"><div class="panel-head"><h3>近期 CI 应收提醒</h3><div class="meta">仅显示未收金额大于 0</div></div>${unpaidCis.length?`<div class="table-wrap"><table><thead><tr><th>CI / 对应订单</th><th>客户</th><th>CI 日期</th><th>到期日</th><th>计划应收</th><th>已收</th><th>未收</th><th>状态</th></tr></thead><tbody>${unpaidCis.map(ci=>`<tr><td><strong>${safe(ci.ciNo)}</strong><div class="detail">${safe(linkedOrders(ci).join(" / ")||"未关联订单")}</div></td><td>${safe(ci.customerName)}</td><td>${safe(ci.ciDate)}</td><td>${safe(ci.dueDate||"—")}</td><td class="money">${money(ci.receivable)}</td><td class="money good">${money(ci.received)}</td><td class="money warn">${money(ci.outstanding)}</td><td>${tag(ci.status)}</td></tr>`).join("")}</tbody></table></div>`:empty("当前没有待收 CI")}</div>`}
    const agingTag=item=>!item.dueDate?'<span class="tag">未设到期日</span>':item.overdueMoreThan60Days?`<span class="tag bad">逾期 ${item.daysOverdue} 天</span>`:item.daysOverdue>0?`<span class="tag warn">逾期 ${item.daysOverdue} 天</span>`:item.isDue?'<span class="tag warn">今日到期</span>':'<span class="tag good">未到期</span>';
    function renderReceivables(){
      const allGroups=state.data.receivablesByCustomer,names=availableNames(allGroups,"customerName","receivables"),groups=allGroups.filter(group=>matchesFilter(group,"receivables","customerName",row=>[row.customerName,...row.items.flatMap(item=>[item.ciNo,...item.orderNos,item.status,item.dueDate])]));
      const s=state.data.summary;
      const qualityIssues=[
        s.unlinkedArPlanCount?`${s.unlinkedArPlanCount} 条活动 ARCI 无法关联 CI，未计入汇总`:"",
        s.conflictingArPlanCount?`${s.conflictingArPlanCount} 条 ARCI 编号与对应 CI 冲突，请核对关系`:""
      ].filter(Boolean);
      const qualityWarning=qualityIssues.length?`<div class="notice show error">${qualityIssues.join("；")}。</div>`:"";
      const schemaWarning=state.data.meta.schemaOutdated?'<div class="notice show stale">数据结构正在更新，当前到期分组暂不展示；请稍后刷新。</div>':"";
      $("#receivables-view").innerHTML=`<div class="cards"><div class="card"><div class="card-label">客户应收总额</div><div class="card-value warn">${money(s.totalOutstanding)}</div><div class="card-sub">${s.outstandingCiCount} 个待收 CI</div></div><div class="card"><div class="card-label">已到期应收</div><div class="card-value ${s.totalDueOutstanding>0?'warn':'good'}">${money(s.totalDueOutstanding)}</div><div class="card-sub">到期日不晚于今天</div></div><div class="card"><div class="card-label">逾期超过 2 个月</div><div class="card-value ${s.totalOver60Outstanding>0?'bad':'good'}">${money(s.totalOver60Outstanding)}</div><div class="card-sub">逾期超过 60 天</div></div><div class="card"><div class="card-label">待收客户</div><div class="card-value">${s.customerReceivableCount}</div><div class="card-sub">仅统计未收金额大于 0</div></div></div>${qualityWarning}${schemaWarning}<div class="notice show stale">口径提示：已收款需先在飞书完成分摊与 ARCI 核销同步，才会从本页未收金额中移除。</div><div class="panel filter-panel"><div class="panel-head"><h3 aria-live="polite">按客户汇总与订单拆分（${groups.length} / ${allGroups.length}）</h3>${multiFilter("receivables","客户",names,"搜索客户、CI 或订单")}</div></div>${groups.length?groups.map(group=>`<div class="panel"><div class="panel-head"><div class="receivable-title"><h3>${safe(group.customerName)}</h3><div class="receivable-metric">应收总额<strong class="warn">${money(group.totalOutstanding)}</strong></div><div class="receivable-metric">已到期<strong class="warn">${money(group.dueOutstanding)}</strong></div><div class="receivable-metric">逾期超 2 个月<strong class="bad">${money(group.over60Outstanding)}</strong></div></div></div><div class="table-wrap"><table><thead><tr><th>CI / 对应订单</th><th>CI 日期</th><th>到期日</th><th>未收金额</th><th>已到期</th><th>超 2 个月</th><th>账龄</th><th>状态</th></tr></thead><tbody>${group.items.map(item=>`<tr><td><strong>${safe(item.ciNo)}</strong><div class="detail">${safe(item.orderNos.join(" / ")||"未关联订单")}</div></td><td>${safe(item.ciDate||"—")}</td><td>${safe(item.dueDate||"—")}</td><td class="money warn">${money(item.outstanding,item.currency)}</td><td class="money ${item.dueOutstanding>0?'warn':''}">${money(item.dueOutstanding,item.currency)}</td><td class="money ${item.over60Outstanding>0?'bad':''}">${money(item.over60Outstanding,item.currency)}</td><td>${agingTag(item)}</td><td>${tag(item.status)}</td></tr>`).join("")}</tbody></table></div></div>`).join(""):empty("没有匹配的待收应收")}`;
      bindFilterControls("receivables");
    }
    function renderCollections(){
      const s=state.data.summary,plan=buildMonthlyPlan(state.collectionMonth),items=plan.flatMap(group=>group.items),totals=currencyTotals(items),missingEmails=plan.filter(group=>group.emailEligible&&!extractEmails(group.customerEmail).length).length,unscheduled=(state.data.receivablesByCustomer||[]).flatMap(group=>group.schedules||[]).filter(schedule=>!schedule.dueDate&&Number(schedule.outstanding||0)>0).length;
      state.monthlyPlan=plan;
      const qualityIssues=[
        s.unlinkedArPlanCount?`${s.unlinkedArPlanCount} 条活动 ARCI 无法关联 CI，未计入月度计划`:"",
        s.conflictingArPlanCount?`${s.conflictingArPlanCount} 条 ARCI 编号与对应 CI 冲突，未计入月度计划`:"",
        s.ambiguousCustomerCiCount?`${s.ambiguousCustomerCiCount} 个待收 CI 的客户关系不是唯一值，相关邮件按钮已禁用`:""
      ].filter(Boolean);
      const qualityWarning=qualityIssues.length?`<div class="notice show error">${qualityIssues.join("；")}。请先修正飞书关系再发送催款邮件。</div>`:"";
      const schemaWarning=state.data.meta.monthlyCollectionsOutdated?'<div class="notice show stale">月度计划数据结构正在更新，请稍后刷新。</div>':"";
      const emailWarning=missingEmails?`<div class="notice show stale">所选截止范围内有 ${missingEmails} 个待收客户尚未在“客户档案”填写邮箱；仍可生成邮件草稿，但需要手工补收件人。</div>`:"";
      const scheduleWarning=unscheduled?`<div class="notice show error">${unscheduled} 条未收 ARCI 没有到期日，无法归入月度计划，请先在飞书补齐。</div>`:"";
      $("#collections-view").innerHTML=`<div class="panel"><div class="panel-head"><div><h3>选择截止月份</h3><div class="detail">显示所有到期日不晚于所选月月底、目前仍未付清的 ARCI；以前月份欠款会持续结转，直到付清</div></div><input id="collection-month" class="month-picker" type="month" value="${safe(state.collectionMonth)}" aria-label="选择回款截止月份"></div></div><div class="cards" aria-live="polite"><div class="card"><div class="card-label">截至该月末到期、当前未收</div><div class="card-value warn">${safe(totalsText(totals))}</div><div class="card-sub">含以前月份结转；付清后自动移除</div></div><div class="card"><div class="card-label">涉及客户</div><div class="card-value">${plan.length}</div><div class="card-sub">按客户档案关系汇总</div></div><div class="card"><div class="card-label">ARCI 计划项</div><div class="card-value">${items.length}</div><div class="card-sub">历史未付计划逐月持续结转</div></div><div class="card"><div class="card-label">缺少客户邮箱</div><div class="card-value ${missingEmails?'warn':'good'}">${missingEmails}</div><div class="card-sub">填写后可自动带入收件人</div></div></div>${qualityWarning}${schemaWarning}${scheduleWarning}${emailWarning}<div class="notice show stale">重要：月度计划和邮件均按飞书 ARCI 当前核销状态生成。已确认收款若尚未同步到 ARCI，仍会被列为未收；发送前必须与收款分摊或银行记录核对。按钮只生成草稿，不会自动发送。</div>${plan.length?plan.map((group,index)=>{const emails=extractEmails(group.customerEmail),eligible=group.emailEligible;return `<div class="panel"><div class="panel-head"><div class="collection-customer"><div><h3>${safe(group.customerName)}</h3><div class="collection-contact">${safe(eligible?(group.contactName?`联系人：${group.contactName}`:"未维护联系人"):"客户关系异常")} · ${safe(eligible?(emails.join(", ")||"未维护邮箱"):"收件人未自动带入")}</div><div class="collection-total warn">${safe(totalsText(group.totals))}</div></div><div class="collection-actions">${eligible?`<button type="button" class="collection-action ${emails.length?"":"warn"}" data-email-draft="${index}">${emails.length?"打开催款邮件草稿":"生成草稿（缺邮箱）"}</button><button type="button" class="collection-action" data-copy-draft="${index}">复制邮件内容</button>`:'<button type="button" class="collection-action" disabled>客户关系异常，禁止生成</button>'}</div></div></div><div class="table-wrap"><table><thead><tr><th>CI / 对应订单</th><th>到期日</th><th>当前未收金额</th><th>状态</th></tr></thead><tbody>${group.items.map(item=>`<tr><td><strong>${safe(item.ciNo||"—")}</strong><div class="detail">${safe(item.orderNos.join(" / ")||"未关联订单")}</div></td><td>${safe(item.dueDate)}</td><td class="money warn">${money(item.outstanding,item.currency)}</td><td>${tag(item.status)}</td></tr>`).join("")}</tbody></table></div></div>`}).join(""):empty(`${monthName(state.collectionMonth)}月底前没有当前仍未收的到期计划`)}`;
      $("#collection-month").addEventListener("change",event=>{if(!/^\d{4}-\d{2}$/.test(event.target.value))return;state.collectionMonth=event.target.value;renderCollections();$("#collection-month")?.focus()});
      document.querySelectorAll("[data-email-draft]").forEach(button=>button.addEventListener("click",async event=>{const group=state.monthlyPlan[Number(event.currentTarget.dataset.emailDraft)];if(!group||!group.emailEligible)return;const draft=reminderDraft(group),href=mailtoHref(draft);if(href.length>1800){try{await copyText(reminderClipboardText(draft));event.currentTarget.textContent="内容已复制";showNotice("邮件内容较长，已复制到剪贴板；请粘贴到邮件客户端后发送。","stale")}catch{showNotice("邮件内容较长，无法可靠打开草稿；请使用“复制邮件内容”。")}return}window.location.href=href}));
      document.querySelectorAll("[data-copy-draft]").forEach(button=>button.addEventListener("click",async event=>{const group=state.monthlyPlan[Number(event.currentTarget.dataset.copyDraft)];if(!group||!group.emailEligible)return;try{await copyText(reminderClipboardText(reminderDraft(group)));event.currentTarget.textContent="已复制";showNotice("催款邮件内容已复制，请粘贴到邮件客户端并核对后发送。","stale")}catch{showNotice("复制失败，请检查浏览器的剪贴板权限。")}}));
    }
    function renderOrders(){const allRows=state.data.orders,names=availableNames(allRows,"customerName","orders"),rows=allRows.filter(o=>matchesFilter(o,"orders","customerName",row=>[row.orderNo,row.customerName,row.date,row.status,row.paymentStatus]));$("#orders-view").innerHTML=`<div class="panel filter-panel"><div class="panel-head"><h3 aria-live="polite">客户订单（${rows.length} / ${allRows.length}）</h3>${multiFilter("orders","客户",names,"搜索 PO、客户、日期或状态")}</div>${rows.length?`<div class="table-wrap"><table><thead><tr><th>订单</th><th>客户</th><th>日期</th><th>销售额</th><th>成本</th><th>毛利润 / 毛利率</th><th>待发货</th><th>状态</th></tr></thead><tbody>${rows.map(o=>`<tr><td><strong>${safe(o.orderNo)}</strong><div class="detail">${o.lineCount} 个产品行</div></td><td>${safe(o.customerName)}</td><td>${safe(o.date)}</td><td class="money">${money(o.amount,o.currency)}</td><td class="money">${money(o.cost)}</td><td><span class="money good">${money(o.profit)}</span><div class="detail">${pct(o.margin)}</div></td><td class="money warn">${money(o.pendingAmount)}</td><td>${tag(o.status)} <div class="detail">${safe(o.paymentStatus||"")}</div></td></tr>`).join("")}</tbody></table></div>`:empty("没有匹配的订单")}</div>`;bindFilterControls("orders")}
    function renderSuppliers(){const allRows=state.data.supplierOrders,names=availableNames(allRows,"supplierName","suppliers"),rows=allRows.filter(o=>matchesFilter(o,"suppliers","supplierName",row=>[row.orderNo,row.supplierName,row.date,row.status,row.deliveryStatus,row.paymentStatus]));$("#suppliers-view").innerHTML=`<div class="panel filter-panel"><div class="panel-head"><h3 aria-live="polite">供应商订单（${rows.length} / ${allRows.length}）</h3>${multiFilter("suppliers","供应商",names,"搜索合同、供应商、日期或状态")}</div>${rows.length?`<div class="table-wrap"><table><thead><tr><th>采购订单</th><th>供应商</th><th>日期</th><th>原币金额</th><th>折算 USD</th><th>已付 / 应付余额</th><th>交付</th><th>状态</th></tr></thead><tbody>${rows.map(o=>`<tr><td><strong>${safe(o.orderNo)}</strong><div class="detail">${o.lineCount} 个采购行</div></td><td>${safe(o.supplierName)}</td><td>${safe(o.date)}</td><td class="money">${money(o.originalAmount,o.originalCurrency||"USD")}</td><td class="money">${money(o.usdAmount)}</td><td><span class="money good">${money(o.paidAmount)}</span><div class="detail">余额 ${money(o.payableBalance)}</div></td><td>${tag(o.deliveryStatus)}</td><td>${tag(o.status)} <div class="detail">${safe(o.paymentStatus||"")}</div></td></tr>`).join("")}</tbody></table></div>`:empty("没有匹配的供应商订单")}</div>`;bindFilterControls("suppliers")}
    function renderShipments(){const allRows=state.data.cis,names=availableNames(allRows,"customerName","shipments"),rows=allRows.filter(ci=>matchesFilter(ci,"shipments","customerName",row=>[row.ciNo,...linkedOrders(row),row.customerName,row.ciDate,row.dueDate,row.status]));$("#shipments-view").innerHTML=`<div class="panel filter-panel"><div class="panel-head"><h3 aria-live="polite">CI 发货与应收（${rows.length} / ${allRows.length}）</h3>${multiFilter("shipments","客户",names,"搜索 CI、订单、客户、日期或状态")}</div>${rows.length?`<div class="table-wrap"><table><thead><tr><th>CI / 对应订单</th><th>客户</th><th>CI / 发货日期</th><th>CI 金额</th><th>到期日</th><th>计划应收</th><th>已收</th><th>未收</th><th>状态</th></tr></thead><tbody>${rows.map(ci=>`<tr><td><strong>${safe(ci.ciNo)}</strong><div class="detail">${safe(linkedOrders(ci).join(" / ")||"未关联订单")} · ${ci.lineCount} 个出货行</div></td><td>${safe(ci.customerName)}</td><td>${safe(ci.ciDate)}<div class="detail">${safe(ci.shipmentDate||"")}</div></td><td class="money">${money(ci.amount,ci.currency)}</td><td>${safe(ci.dueDate||"—")}</td><td class="money">${money(ci.receivable)}</td><td class="money good">${money(ci.received)}</td><td class="money ${ci.outstanding>0?'warn':'good'}">${money(ci.outstanding)}</td><td>${tag(ci.status)}</td></tr>`).join("")}</tbody></table></div>`:empty("没有匹配的 CI")}</div>`;bindFilterControls("shipments")}
    function renderFilteredView(kind){if(kind==="receivables")renderReceivables();if(kind==="orders")renderOrders();if(kind==="suppliers")renderSuppliers();if(kind==="shipments")renderShipments()}
    function restoreFilterControl(kind,type,value,scrollTop=0){const root=$(`#${kind}-view`),options=root.querySelector(".multi-filter-options");if(options)options.scrollTop=scrollTop;const target=type==="option"?[...root.querySelectorAll("[data-filter-option]")].find(input=>input.value===value):root.querySelector(`[data-filter-${type}="${kind}"]`);target?.focus();if(type==="query")target?.setSelectionRange(value.length,value.length)}
    function bindFilterControls(kind){const root=$(`#${kind}-view`);root.querySelectorAll("[data-filter-details]").forEach(details=>{details.addEventListener("toggle",()=>{if(details.open)state.openFilter=details.dataset.filterDetails;else if(state.openFilter===details.dataset.filterDetails)state.openFilter=null});details.addEventListener("keydown",event=>{if(event.key!=="Escape"||!details.open)return;event.preventDefault();details.removeAttribute("open");state.openFilter=null;details.querySelector("summary")?.focus()})});root.querySelectorAll("[data-filter-query]").forEach(input=>input.addEventListener("input",event=>{const currentKind=event.target.dataset.filterQuery,value=event.target.value;state.filters[currentKind].query=value;if(event.isComposing)return;state.openFilter=currentKind;renderFilteredView(currentKind);restoreFilterControl(currentKind,"query",value)}));root.querySelectorAll("[data-filter-option]").forEach(input=>input.addEventListener("change",event=>{const currentKind=event.target.dataset.filterOption,selected=state.filters[currentKind].selected,value=event.target.value,scrollTop=event.target.closest(".multi-filter-options")?.scrollTop||0;if(event.target.checked)selected.add(value);else selected.delete(value);state.openFilter=currentKind;renderFilteredView(currentKind);restoreFilterControl(currentKind,"option",value,scrollTop)}));root.querySelectorAll("[data-filter-clear]").forEach(button=>button.addEventListener("click",event=>{const currentKind=event.currentTarget.dataset.filterClear;state.filters[currentKind].query="";state.filters[currentKind].selected.clear();state.openFilter=currentKind;renderFilteredView(currentKind);restoreFilterControl(currentKind,"clear","")}))}
    function render(){if(!state.data)return;renderDashboard();renderReceivables();renderCollections();renderOrders();renderSuppliers();renderShipments();switchView(state.view);const date=new Date(state.data.meta.generatedAt);$("#meta").textContent=`数据源：飞书多维表格 · 更新于 ${date.toLocaleString("zh-CN",{timeZone:"Asia/Singapore",hour12:false})}`}
    function switchView(view){state.view=view;state.openFilter=null;document.querySelectorAll(".multi-filter[open]").forEach(details=>details.removeAttribute("open"));const titles={dashboard:"业务概览",receivables:"客户应收汇总",collections:"月度回款计划",orders:"客户订单",suppliers:"供应商订单",shipments:"CI 发货与应收"};$("#title").textContent=titles[view];document.querySelectorAll("[id$='-view']").forEach(el=>el.classList.toggle("hidden",el.id!==`${view}-view`));document.querySelectorAll(".nav-btn").forEach(btn=>{const active=btn.dataset.view===view;btn.classList.toggle("active",active);if(active)btn.setAttribute("aria-current","page");else btn.removeAttribute("aria-current")})}
    function showLogin(message=""){$("#app").classList.add("hidden");$("#auth").classList.remove("hidden");$("#auth-error").textContent=message;$("#password").value="";$("#password").focus();if(state.timer){clearInterval(state.timer);state.timer=null}for(const filter of Object.values(state.filters)){filter.query="";filter.selected.clear()}state.openFilter=null;state.collectionMonth="";state.monthlyPlan=[];state.started=false;state.data=null}
    function showApp(){$("#auth").classList.add("hidden");$("#app").classList.remove("hidden")}
    function startApp(){if(state.started)return;state.started=true;showApp();loadData();state.timer=setInterval(()=>loadData(false),60000)}
    function normalizeData(data){data.meta=data.meta||{};data.meta.schemaOutdated=!Array.isArray(data.receivablesByCustomer);data.cis=Array.isArray(data.cis)?data.cis:[];for(const ci of data.cis)ci.orderNos=linkedOrders(ci);data.receivablesByCustomer=Array.isArray(data.receivablesByCustomer)?data.receivablesByCustomer:[];data.meta.monthlyCollectionsOutdated=data.receivablesByCustomer.some(group=>!Array.isArray(group.schedules));for(const group of data.receivablesByCustomer){group.items=Array.isArray(group.items)?group.items:[];group.schedules=Array.isArray(group.schedules)?group.schedules:[];group.emailEligible=group.emailEligible===true;for(const item of group.items){item.orderNos=linkedOrders(item);item.dueOutstanding??=item.isDue?item.outstanding:0;item.over60Outstanding??=item.overdueMoreThan60Days?item.outstanding:0}for(const schedule of group.schedules)schedule.orderNos=linkedOrders(schedule)}data.summary=data.summary||{};data.summary.outstandingCiCount??=data.cis.filter(ci=>ci.outstanding>0).length;data.summary.totalDueOutstanding??=0;data.summary.totalOver60Outstanding??=0;data.summary.customerReceivableCount??=data.receivablesByCustomer.length;data.summary.unlinkedArPlanCount??=0;data.summary.conflictingArPlanCount??=0;data.summary.ambiguousCustomerCiCount??=0;if(!state.collectionMonth)state.collectionMonth=monthKey(data.meta.generatedAt||new Date());return data}
    async function loadData(manual=false){if(state.busy)return;state.busy=true;$("#refresh").disabled=true;if(manual)clearNotice();try{const response=await fetch("/api/order-status",{credentials:"same-origin",cache:"no-store"});if(response.status===401){showLogin("登录已失效，请重新登录。");return}if(!response.ok)throw new Error("飞书数据暂时无法读取，请稍后重试。");const data=await response.json();state.data=normalizeData(data);$("#loading").classList.add("hidden");$("#content").classList.remove("hidden");clearNotice();render()}catch(error){if(state.data)showNotice(`${error.message} 当前页面继续显示上次成功数据。`,"stale");else{$("#loading").textContent=error.message;showNotice(error.message)}}finally{state.busy=false;$("#refresh").disabled=false}}
    async function boot(){try{const response=await fetch("/api/session",{credentials:"same-origin",cache:"no-store"});const session=await response.json();if(session.authenticated)startApp();else showLogin()}catch{showLogin("暂时无法连接服务器，请稍后重试。")}}
    document.querySelectorAll(".nav-btn").forEach(btn=>btn.addEventListener("click",()=>switchView(btn.dataset.view)));$("#refresh").addEventListener("click",()=>loadData(true));$("#login-form").addEventListener("submit",async event=>{event.preventDefault();const button=$("#login-button");button.disabled=true;$("#auth-error").textContent="";try{const response=await fetch("/api/login",{method:"POST",credentials:"same-origin",headers:{"content-type":"application/json"},body:JSON.stringify({password:$("#password").value})});if(!response.ok)throw new Error(response.status===401?"密码不正确。":"登录暂时不可用。");startApp()}catch(error){$("#auth-error").textContent=error.message}finally{button.disabled=false}});$("#logout").addEventListener("click",async()=>{await fetch("/api/logout",{method:"POST",credentials:"same-origin"}).catch(()=>{});showLogin()});document.addEventListener("click",event=>{const open=document.querySelector(".multi-filter[open]");if(open&&!open.contains(event.target)){open.removeAttribute("open");state.openFilter=null}});document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&state.started)loadData(false)});boot();
  </script>
