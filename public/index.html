<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>外贸订单管家</title>
  <style>
    :root{color-scheme:light;--bg:#f5f7fb;--panel:#fff;--line:#e2e8f0;--text:#172033;--muted:#64748b;--brand:#2451a4;--good:#059669;--warn:#d97706;--bad:#dc2626;--shadow:0 12px 32px rgba(15,23,42,.07)}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}.auth-screen{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#eef4ff,#f8fafc 48%)}.auth-card{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:var(--shadow)}.logo{background-image:url('/wincotek-logo.png');background-repeat:no-repeat;background-position:center}.auth-logo{width:100%;height:82px;margin:-2px 0 8px;background-size:112% auto}.auth-card h1{margin:4px 0 6px;font-size:23px}.auth-card p{margin:0 0 22px;color:var(--muted);font-size:14px;line-height:1.6}.auth-card label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.auth-card input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px}.auth-card button{width:100%;margin-top:14px;border:0;border-radius:10px;padding:11px;background:var(--brand);color:#fff;font-weight:800;cursor:pointer}.auth-card button:disabled{opacity:.6}.auth-error{min-height:20px;color:var(--bad);font-size:13px;margin-top:10px}.toolbar-actions{display:flex;gap:8px}.logout{border:1px solid var(--line);background:#fff;color:var(--muted);padding:9px 13px;border-radius:10px;cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:#fff;border-right:1px solid var(--line);padding:24px 18px;position:sticky;top:0;height:100vh}.brand{margin:0 8px 26px}.sidebar-logo{width:100%;height:54px;background-size:112% auto}.brand small{display:block;color:var(--muted);text-align:center;margin-top:2px}nav{display:grid;gap:7px}.nav-btn{border:0;background:transparent;text-align:left;border-radius:11px;padding:11px 13px;color:#475569;cursor:pointer}.nav-btn:hover,.nav-btn.active{background:#eef4ff;color:var(--brand);font-weight:700}.side-note{position:absolute;bottom:20px;left:18px;right:18px;padding:13px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:12px;line-height:1.5}.main{padding:28px;min-width:0}.toolbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px}.toolbar h2{margin:0 0 5px;font-size:25px}.meta{color:var(--muted);font-size:13px}.refresh{border:1px solid #bfdbfe;background:#fff;color:var(--brand);padding:9px 13px;border-radius:10px;cursor:pointer;font-weight:700}.refresh:disabled{opacity:.55}.notice{display:none;padding:13px 15px;border-radius:11px;margin-bottom:18px}.notice.show{display:block}.notice.error{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}.notice.stale{background:#fffbeb;color:#92400e;border:1px solid #fde68a}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.card{padding:18px}.card-label{color:var(--muted);font-size:13px}.card-value{font-size:25px;font-weight:800;margin-top:8px}.card-sub{font-size:12px;color:var(--muted);margin-top:4px}.panel{overflow:hidden;margin-bottom:18px}.panel-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.panel-head h3{margin:0;font-size:16px}.search{border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:230px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:820px}th,td{text-align:left;padding:12px 15px;border-bottom:1px solid #edf2f7;font-size:13px;vertical-align:top}th{color:var(--muted);font-weight:600;background:#fafbfc;position:sticky;top:0}tr:last-child td{border-bottom:0}.money{font-variant-numeric:tabular-nums;font-weight:650}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}.tag{display:inline-flex;border-radius:999px;padding:4px 8px;background:#f1f5f9;color:#475569;font-size:11px;font-weight:700}.tag.good{background:#ecfdf5;color:#047857}.tag.warn{background:#fff7ed;color:#c2410c}.tag.bad{background:#fef2f2;color:#b91c1c}.empty{padding:44px;text-align:center;color:var(--muted)}.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted)}.detail{color:var(--muted);font-size:12px;margin-top:4px}.hidden{display:none!important}
    @media(max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.app{display:block}.sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:14px}.brand{margin-bottom:12px}nav{display:flex;overflow:auto}.nav-btn{white-space:nowrap}.side-note{display:none}.main{padding:18px}.toolbar{align-items:center}.cards{grid-template-columns:1fr 1fr}.search{width:150px}}@media(max-width:480px){.cards{grid-template-columns:1fr}.toolbar h2{font-size:21px}}
  </style>
</head>
<body>
  <div id="auth" class="auth-screen">
    <form id="login-form" class="auth-card">
      <div class="logo auth-logo" role="img" aria-label="WincoTek"></div>
      <h1>外贸订单管家</h1>
      <p>请输入访问密码。业务数据不会保存在浏览器中。</p>
      <label for="password">访问密码</label>
      <input id="password" name="password" type="password" minlength="12" autocomplete="current-password" required autofocus>
      <button id="login-button" type="submit">登录</button>
      <div id="auth-error" class="auth-error" role="alert"></div>
    </form>
  </div>
  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand"><div class="logo sidebar-logo" role="img" aria-label="WincoTek"></div><small>外贸订单管家 · Feishu Live</small></div>
      <nav>
        <button class="nav-btn active" data-view="dashboard">业务概览</button>
        <button class="nav-btn" data-view="orders">客户订单</button>
        <button class="nav-btn" data-view="suppliers">供应商订单</button>
        <button class="nav-btn" data-view="shipments">CI 发货与应收</button>
      </nav>
      <div class="side-note">只读页面<br>数据来自飞书多维表格<br>订单、发货、收款按不同业务粒度展示</div>
    </aside>
    <main class="main">
      <div id="loading" class="loading">正在读取飞书数据…</div>
      <div id="content" class="hidden">
        <header class="toolbar"><div><h2 id="title">业务概览</h2><div id="meta" class="meta"></div></div><div class="toolbar-actions"><button id="refresh" class="refresh">刷新数据</button><button id="logout" class="logout">退出</button></div></header>
        <div id="notice" class="notice"></div>
        <section id="dashboard-view"></section>
        <section id="orders-view" class="hidden"></section>
        <section id="suppliers-view" class="hidden"></section>
        <section id="shipments-view" class="hidden"></section>
      </div>
    </main>
  </div>
  <script>
    const state={data:null,view:"dashboard",busy:false,timer:null,started:false};
    const $=selector=>document.querySelector(selector);
    const money=(value,currency="USD")=>new Intl.NumberFormat("zh-CN",{style:"currency",currency:currency||"USD",maximumFractionDigits:2}).format(Number(value||0));
    const pct=value=>`${(Number(value||0)*(Math.abs(value)<=1?100:1)).toFixed(1)}%`;
    const safe=value=>String(value??"").replace(/[&<>'"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[ch]));
    const tag=value=>{const text=String(value||"未设置");const cls=/逾期|异常|风险|未匹配|取消/.test(text)?"bad":/完成|已收|已付|已发完|正常|闭环/.test(text)?"good":/部分|待|未/.test(text)?"warn":"";return `<span class="tag ${cls}">${safe(text)}</span>`};
    const empty=message=>`<div class="empty">${safe(message)}</div>`;
    function showNotice(message,type="error"){const el=$("#notice");el.textContent=message;el.className=`notice show ${type}`}
    function clearNotice(){$("#notice").className="notice"}
    function customerSummary(orders){const map=new Map();for(const order of orders){const row=map.get(order.customerName)||{name:order.customerName,sales:0,profit:0,count:0};row.sales+=order.amount;row.profit+=order.profit;row.count++;map.set(order.customerName,row)}return [...map.values()].sort((a,b)=>b.sales-a.sales)}
    function renderDashboard(){const d=state.data,s=d.summary,customers=customerSummary(d.orders).slice(0,10);$("#dashboard-view").innerHTML=`
      <div class="cards">
        <div class="card"><div class="card-label">累计订单销售额</div><div class="card-value">${money(s.totalSales)}</div><div class="card-sub">订单粒度 · ${s.orderCount} 个订单</div></div>
        <div class="card"><div class="card-label">累计订单毛利润</div><div class="card-value good">${money(s.totalProfit)}</div><div class="card-sub">订单粒度 · 当前核算汇率</div></div>
        <div class="card"><div class="card-label">加权毛利率</div><div class="card-value">${pct(s.weightedMargin)}</div><div class="card-sub">利润合计 ÷ 销售额合计</div></div>
        <div class="card"><div class="card-label">CI 未收应收</div><div class="card-value ${s.totalOutstanding>0?'warn':'good'}">${money(s.totalOutstanding)}</div><div class="card-sub">ARCI 核销粒度 · ${s.ciCount} 个 CI</div></div>
      </div>
      <div class="panel"><div class="panel-head"><h3>客户贡献（订单口径）</h3></div><div class="table-wrap"><table><thead><tr><th>客户</th><th>订单数</th><th>销售额</th><th>毛利润</th><th>加权毛利率</th></tr></thead><tbody>${customers.map(c=>`<tr><td><strong>${safe(c.name)}</strong></td><td>${c.count}</td><td class="money">${money(c.sales)}</td><td class="money good">${money(c.profit)}</td><td>${pct(c.sales?c.profit/c.sales:0)}</td></tr>`).join("")}</tbody></table></div></div>
      <div class="panel"><div class="panel-head"><h3>近期 CI 应收提醒</h3></div><div class="table-wrap"><table><thead><tr><th>CI</th><th>客户</th><th>CI 日期</th><th>到期日</th><th>计划应收</th><th>已收</th><th>未收</th><th>状态</th></tr></thead><tbody>${d.cis.slice().sort((a,b)=>(a.dueDate||"9999").localeCompare(b.dueDate||"9999")).slice(0,12).map(ci=>`<tr><td><strong>${safe(ci.ciNo)}</strong></td><td>${safe(ci.customerName)}</td><td>${safe(ci.ciDate)}</td><td>${safe(ci.dueDate||"—")}</td><td class="money">${money(ci.receivable)}</td><td class="money good">${money(ci.received)}</td><td class="money ${ci.outstanding>0?'warn':'good'}">${money(ci.outstanding)}</td><td>${tag(ci.status)}</td></tr>`).join("")}</tbody></table></div></div>`}
    function renderOrders(filter=""){const rows=state.data.orders.filter(o=>JSON.stringify([o.orderNo,o.customerName,o.status]).toLowerCase().includes(filter.toLowerCase()));$("#orders-view").innerHTML=`<div class="panel"><div class="panel-head"><h3>客户订单（${rows.length}）</h3><input class="search" data-search="orders" placeholder="搜索 PO、客户或状态" value="${safe(filter)}"></div>${rows.length?`<div class="table-wrap"><table><thead><tr><th>订单</th><th>客户</th><th>日期</th><th>销售额</th><th>成本</th><th>毛利润 / 毛利率</th><th>待发货</th><th>状态</th></tr></thead><tbody>${rows.map(o=>`<tr><td><strong>${safe(o.orderNo)}</strong><div class="detail">${o.lineCount} 个产品行</div></td><td>${safe(o.customerName)}</td><td>${safe(o.date)}</td><td class="money">${money(o.amount,o.currency)}</td><td class="money">${money(o.cost)}</td><td><span class="money good">${money(o.profit)}</span><div class="detail">${pct(o.margin)}</div></td><td class="money warn">${money(o.pendingAmount)}</td><td>${tag(o.status)} <div class="detail">${safe(o.paymentStatus||"")}</div></td></tr>`).join("")}</tbody></table></div>`:empty("没有匹配的订单")}</div>`;bindSearch()}
    function renderSuppliers(filter=""){const rows=state.data.supplierOrders.filter(o=>JSON.stringify([o.orderNo,o.supplierName,o.status]).toLowerCase().includes(filter.toLowerCase()));$("#suppliers-view").innerHTML=`<div class="panel"><div class="panel-head"><h3>供应商订单（${rows.length}）</h3><input class="search" data-search="suppliers" placeholder="搜索合同、供应商或状态" value="${safe(filter)}"></div>${rows.length?`<div class="table-wrap"><table><thead><tr><th>采购订单</th><th>供应商</th><th>日期</th><th>原币金额</th><th>折算 USD</th><th>已付 / 应付余额</th><th>交付</th><th>状态</th></tr></thead><tbody>${rows.map(o=>`<tr><td><strong>${safe(o.orderNo)}</strong><div class="detail">${o.lineCount} 个采购行</div></td><td>${safe(o.supplierName)}</td><td>${safe(o.date)}</td><td class="money">${money(o.originalAmount,o.originalCurrency||"USD")}</td><td class="money">${money(o.usdAmount)}</td><td><span class="money good">${money(o.paidAmount)}</span><div class="detail">余额 ${money(o.payableBalance)}</div></td><td>${tag(o.deliveryStatus)}</td><td>${tag(o.status)} <div class="detail">${safe(o.paymentStatus||"")}</div></td></tr>`).join("")}</tbody></table></div>`:empty("没有匹配的供应商订单")}</div>`;bindSearch()}
    function renderShipments(filter=""){const rows=state.data.cis.filter(ci=>JSON.stringify([ci.ciNo,ci.customerName,ci.status]).toLowerCase().includes(filter.toLowerCase()));$("#shipments-view").innerHTML=`<div class="panel"><div class="panel-head"><h3>CI 发货与应收（${rows.length}）</h3><input class="search" data-search="shipments" placeholder="搜索 CI、客户或状态" value="${safe(filter)}"></div>${rows.length?`<div class="table-wrap"><table><thead><tr><th>CI</th><th>客户</th><th>CI / 发货日期</th><th>CI 金额</th><th>到期日</th><th>计划应收</th><th>已收</th><th>未收</th><th>状态</th></tr></thead><tbody>${rows.map(ci=>`<tr><td><strong>${safe(ci.ciNo)}</strong><div class="detail">${ci.lineCount} 个出货行</div></td><td>${safe(ci.customerName)}</td><td>${safe(ci.ciDate)}<div class="detail">${safe(ci.shipmentDate||"")}</div></td><td class="money">${money(ci.amount,ci.currency)}</td><td>${safe(ci.dueDate||"—")}</td><td class="money">${money(ci.receivable)}</td><td class="money good">${money(ci.received)}</td><td class="money ${ci.outstanding>0?'warn':'good'}">${money(ci.outstanding)}</td><td>${tag(ci.status)}</td></tr>`).join("")}</tbody></table></div>`:empty("没有匹配的 CI")}</div>`;bindSearch()}
    function bindSearch(){document.querySelectorAll("[data-search]").forEach(input=>input.addEventListener("input",event=>{const value=event.target.value;if(event.target.dataset.search==="orders")renderOrders(value);if(event.target.dataset.search==="suppliers")renderSuppliers(value);if(event.target.dataset.search==="shipments")renderShipments(value);const next=document.querySelector(`[data-search="${event.target.dataset.search}"]`);next?.focus();next?.setSelectionRange(value.length,value.length)}))}
    function render(){if(!state.data)return;renderDashboard();renderOrders();renderSuppliers();renderShipments();switchView(state.view);const date=new Date(state.data.meta.generatedAt);$("#meta").textContent=`数据源：飞书多维表格 · 更新于 ${date.toLocaleString("zh-CN",{timeZone:"Asia/Singapore",hour12:false})}`}
    function switchView(view){state.view=view;const titles={dashboard:"业务概览",orders:"客户订单",suppliers:"供应商订单",shipments:"CI 发货与应收"};$("#title").textContent=titles[view];document.querySelectorAll("[id$='-view']").forEach(el=>el.classList.toggle("hidden",el.id!==`${view}-view`));document.querySelectorAll(".nav-btn").forEach(btn=>btn.classList.toggle("active",btn.dataset.view===view))}
    function showLogin(message=""){$("#app").classList.add("hidden");$("#auth").classList.remove("hidden");$("#auth-error").textContent=message;$("#password").value="";$("#password").focus();if(state.timer){clearInterval(state.timer);state.timer=null}state.started=false;state.data=null}
    function showApp(){$("#auth").classList.add("hidden");$("#app").classList.remove("hidden")}
    function startApp(){if(state.started)return;state.started=true;showApp();loadData();state.timer=setInterval(()=>loadData(false),60000)}
    async function loadData(manual=false){if(state.busy)return;state.busy=true;$("#refresh").disabled=true;if(manual)clearNotice();try{const response=await fetch("/api/order-status",{credentials:"same-origin",cache:"no-store"});if(response.status===401){showLogin("登录已失效，请重新登录。");return}if(!response.ok)throw new Error("飞书数据暂时无法读取，请稍后重试。");const data=await response.json();state.data=data;$("#loading").classList.add("hidden");$("#content").classList.remove("hidden");clearNotice();render()}catch(error){if(state.data)showNotice(`${error.message} 当前页面继续显示上次成功数据。`,"stale");else{$("#loading").textContent=error.message;showNotice(error.message)}}finally{state.busy=false;$("#refresh").disabled=false}}
    async function boot(){try{const response=await fetch("/api/session",{credentials:"same-origin",cache:"no-store"});const session=await response.json();if(session.authenticated)startApp();else showLogin()}catch{showLogin("暂时无法连接服务器，请稍后重试。")}}
    document.querySelectorAll(".nav-btn").forEach(btn=>btn.addEventListener("click",()=>switchView(btn.dataset.view)));$("#refresh").addEventListener("click",()=>loadData(true));$("#login-form").addEventListener("submit",async event=>{event.preventDefault();const button=$("#login-button");button.disabled=true;$("#auth-error").textContent="";try{const response=await fetch("/api/login",{method:"POST",credentials:"same-origin",headers:{"content-type":"application/json"},body:JSON.stringify({password:$("#password").value})});if(!response.ok)throw new Error(response.status===401?"密码不正确。":"登录暂时不可用。");startApp()}catch(error){$("#auth-error").textContent=error.message}finally{button.disabled=false}});$("#logout").addEventListener("click",async()=>{await fetch("/api/logout",{method:"POST",credentials:"same-origin"}).catch(()=>{});showLogin()});document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&state.started)loadData(false)});boot();
  </script>
</body>
</html>
